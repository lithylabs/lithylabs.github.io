<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Building a Frenemy · thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;900&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; }
  .thumb { width: 1280px; height: 720px; position: relative; overflow: hidden; background: #141217; font-family: 'Rubik', sans-serif; }
  .map { position: absolute; left: 0; top: -42px; width: 1280px; height: 804px; }
  .shade { position: absolute; inset: 0; background: rgba(15,14,18,0.12); }
  .card { position: absolute; left: 196px; top: 60px; width: 1024px; height: 600px; background: #1F1F23; border: 6px solid var(--a); border-radius: 28px; }
  .series { position: absolute; left: 236px; top: 100px; }
  .series .small { font-weight: 600; font-size: 30px; letter-spacing: 5px; color: #bdb6c4; }
  .series .big { font-weight: 900; font-size: 128px; line-height: 0.92; letter-spacing: -3px; }
  .game { position: absolute; right: 100px; top: 100px; display: flex; align-items: center; gap: 14px; }
  .game .label { font-weight: 900; font-size: 34px; letter-spacing: 3px; color: #fff; }
  .badge { width: 170px; height: 170px; border-radius: 34px; background: var(--b); border: 7px solid #141014; box-shadow: inset 0 0 0 8px rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 108px; line-height: 1; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,0.3); }
  .badge.two { font-size: 96px; }
  .title { position: absolute; left: 390px; top: 290px; width: 790px; height: 350px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .title h1 { margin: 0; font-weight: 900; font-size: 108px; line-height: 0.95; letter-spacing: -2px; color: #fff; }
  .mascot { position: absolute; left: 61px; top: 312px; width: 360px; height: 360px; }
</style>
</head>
<body>
<div class="thumb" id="thumb">
  <img class="map" src="assets/allies-map.jpg" alt="">
  <div class="shade"></div>
  <div class="card"></div>
  <div class="series">
    <div class="small">BUILDING A</div>
    <div class="big"><span style="color: var(--b)">Fren</span><span style="color: var(--a)">emy</span></div>
  </div>
  <div class="game">
    <div class="label">GAME</div>
    <div class="badge" id="badge"></div>
  </div>
  <div class="title"><h1 id="title"></h1></div>
  <div class="mascot" id="mascot"></div>
</div>
<script src="assets/frenemy.js"></script>
<script>
  const p = frenemyParams({ game: '1', title: 'The Baseline', a: 'purple', b: 'gold', face: 'neutral', tilt: '-12' });
  const root = document.getElementById('thumb');
  root.style.setProperty('--a', p.a);
  root.style.setProperty('--b', p.b);
  const badge = document.getElementById('badge');
  badge.textContent = p.game;
  if (String(p.game).length > 1) badge.classList.add('two');
  document.getElementById('title').innerHTML = frenemyLines(p.title);
  const mascot = document.getElementById('mascot');
  mascot.innerHTML = mascotSVG(p.a, p.face, 360);
  mascot.style.transform = `rotate(${p.tilt}deg)`;
</script>
</body>
</html>
